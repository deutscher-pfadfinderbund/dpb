{% load static %}

<header id="dpb-carousel" data-bs-theme="dark" class="carousel slide mb-3" data-bs-ride="carousel"
        aria-label="Bilder mit Pfadfinder Thema">

  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="{% static 'img/carousel/grossfahrt_001_280px.jpg' %}"
           alt="Berge und ein Tal. Pfadfinderinnen und Pfadfinder wandern mit Rucksäcken.">
    </div>
    <div class="carousel-item">
      <img loading="lazy" src="{% static 'img/carousel/grossfahrt_002_280px.jpg' %}"
           alt="Ein Tal. Ein Pfadfinder sitzt auf der Seite im Gras.">
    </div>
    <div class="carousel-item">
      <img loading="lazy" src="{% static 'img/carousel/bundeslager2015_280px.jpg' %}"
           title="Bundeslager 2015"
           alt="Eine große Ansammlung von Schwarzzelten. Blick auf das Bundeslager 2015">
    </div>
    <div class="carousel-item">
      <img loading="lazy" src="{% static 'img/carousel/bundeslager2015_feuer_280px.jpg' %}"
           title="Bundeslagerfeuer 2015"
           alt="Ein großes Feuer in der Nacht. Viele Pfadfinderinnen und Pfadfinder stehen um es herum.">
    </div>
    <div class="carousel-item">
      <img loading="lazy" src="{% static 'img/carousel/irland2012_280px.jpg' %}"
           title="Irland 2012"
           alt="Wandernde Pfadfinderinnen und Pfadfinder entlang einer Straße in Irland 2012.">
    </div>
  </div>

  <div class="carousel-indicators m-0">
    <button type="button" data-bs-target="#dpb-carousel" data-bs-slide-to="0"
            class="active" aria-current="true" aria-label="Springe zu Bild 1"></button>
    <button type="button" data-bs-target="#dpb-carousel" data-bs-slide-to="1" aria-label="Springe zu Bild 2"></button>
    <button type="button" data-bs-target="#dpb-carousel" data-bs-slide-to="2" aria-label="Springe zu Bild 3"></button>
    <button type="button" data-bs-target="#dpb-carousel" data-bs-slide-to="3" aria-label="Springe zu Bild 4"></button>
    <button type="button" data-bs-target="#dpb-carousel" data-bs-slide-to="4" aria-label="Springe zu Bild 5"></button>
  </div>
</header>
